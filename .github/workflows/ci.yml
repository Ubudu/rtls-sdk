name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Bun is a consumer runtime only: the pack smoke test runs the packed package's consumers under it
      # (pinned as on GitLab); every test and build step runs on Node.
      - name: Setup Bun (consumer runtime of the pack smoke test)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      # Same offline lane as the GitLab pipeline (which is canonical): spec, lint, format, typecheck,
      # unit coverage, contract, build, pack smoke and docs checks.
      - name: Offline checks
        run: npm run ci:offline

  publish-dry-run:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci
      - run: npm run generate
      - run: npm run build
      - run: npm pack --dry-run
