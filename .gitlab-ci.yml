stages:
  - offline
  - live
  - release

variables:
  NODE_VERSION: "20"
  # Avoid "shallow file has changed" race condition with concurrent jobs
  GIT_DEPTH: 0
  GIT_STRATEGY: clone

# Runners: the jobs work on a Docker executor (the job runs in `image`) and on a shell executor (a host with
# docker, git and a shell, where `image` is ignored). Every step goes through scripts/ci/in-container.sh, which
# runs the step as it is inside a container and starts the job's image for it on a shell host.
default:
  image: node:${NODE_VERSION}

# =============================================================================
# Development Pipeline (MRs, main branch and tags)
# =============================================================================

# Offline lane: spec, lint, format, typecheck, unit coverage, contract, build, pack smoke and docs checks
# (npm run ci:offline), on the latest Node 20, 22 and 24 images. Bun (pinned) is installed only as a
# consumer runtime: the pack smoke test runs the packed package's consumers under it, to check that the
# published package loads under Bun; every test and build step runs on Node. Nothing in the lane reaches the network after the two installs.
offline:
  stage: offline
  parallel:
    matrix:
      - NODE_VERSION: ["20", "22", "24"]
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
    BUN_VERSION: "1.4.4"
  cache:
    key:
      files:
        - package-lock.json
      prefix: "offline-$NODE_VERSION"
    paths:
      - .npm/
  script:
    - sh scripts/ci/in-container.sh "node:${NODE_VERSION}" sh scripts/ci/offline.sh
  coverage: '/Lines\s*:\s*([\d.]+)%/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# Live lane, tier R only (no tier variable is set here). Inert until the owner defines the protected,
# masked variables RTLS_API_KEY and APP_NAMESPACE; then a manual job on the default branch, never scheduled.
# Live runs use Node 22 or later. No artifact holds response bodies.
live-readonly:
  stage: live
  variables:
    NODE_VERSION: "22"
  resource_group: rtls-live
  script:
    - >-
      sh scripts/ci/in-container.sh "node:${NODE_VERSION}" sh -c
      'mkdir -p "$HOME" && npm ci && npm run test:integration && npm run test:integration:sweep -- --check'
  artifacts:
    when: always
    reports:
      junit: coverage-live/junit.xml
  rules:
    - if: $RTLS_API_KEY && $APP_NAMESPACE && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true

# Scheduled comparison of the vendored spec with the live one (one public request, no credential).
spec-drift:
  stage: live
  allow_failure: true
  script:
    - >-
      sh scripts/ci/in-container.sh "node:${NODE_VERSION}" sh -c
      'mkdir -p "$HOME" && npm ci && npm run spec:drift'
  artifacts:
    when: always
    paths:
      - .cache/spec-drift.md
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

# =============================================================================
# Release Pipeline (tags only)
# =============================================================================

push-to-github:
  stage: release
  variables:
    # ssh needs a passwd entry for its user: on a shell host the step runs as root in the container.
    CI_CONTAINER_ROOT: "1"
  script:
    - sh scripts/ci/in-container.sh "node:${NODE_VERSION}" sh scripts/ci/push-mirror.sh
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

publish-npm:
  stage: release
  script:
    - sh scripts/ci/in-container.sh "node:${NODE_VERSION}" sh scripts/ci/publish.sh
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
